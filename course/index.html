<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Noto Sans CJK SC";
        src: local("Noto Sans CJK SC");
      }
      /* ===== 品牌基线（三套模板共用，改配色改这里） ===== */
      :root {
        --ground: #101418;
        --panel: #1b222b;
        --panel-dim: #161c23;
        --ink: #f2f5f8;
        --sub: #9fb2c3;
        --accent: #ffb03a;
        --accent2: #4cc2ff;
        --font-display: "Noto Sans CJK SC", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px;
        overflow: hidden; background: var(--ground);
        font-family: var(--font-display);
      }
      #root { position: relative; width: 100%; height: 100%; }
      .scene {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
      }
      .kicker { color: var(--accent); font-size: 32px; letter-spacing: 0.35em; margin-bottom: 36px; }
      h1 { color: var(--ink); font-size: 110px; font-weight: 700; letter-spacing: 0.02em; }
      .subtitle { color: var(--sub); font-size: 46px; margin-top: 42px; }
      h2 { color: var(--ink); font-size: 72px; font-weight: 700; }
      /* ===== 分步讲解 ===== */
      .steps-head { width: 1760px; display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 48px; }
      .steps-head .hint { color: var(--sub); font-size: 34px; }
      .steps { display: flex; gap: 24px; width: 1760px; }
      .step {
        width: 333px; height: 500px; background: var(--panel-dim);
        border-radius: 24px; border-top: 10px solid #2c3642;
        padding: 44px 32px; opacity: 0.32;
      }
      .step .num { color: var(--sub); font-size: 54px; font-weight: 700; margin-bottom: 26px; }
      .step .name { color: var(--ink); font-size: 40px; font-weight: 700; line-height: 1.3; margin-bottom: 22px; }
      .step .desc { color: var(--sub); font-size: 29px; line-height: 1.6; }
      .track { width: 1760px; height: 10px; background: #232c36; border-radius: 5px; margin-top: 52px; overflow: hidden; }
      .track .fill { width: 100%; height: 100%; background: var(--accent); transform-origin: left center; transform: scaleX(0); }
      /* ===== 收束页 ===== */
      .points { display: flex; gap: 28px; margin-top: 60px; }
      .point {
        background: var(--panel); border-radius: 20px; border-left: 8px solid var(--accent);
        padding: 36px 44px; color: var(--ink); font-size: 44px; font-weight: 700;
      }
      .endmark { color: var(--sub); font-size: 40px; margin-top: 84px; letter-spacing: 0.2em; }
      .endmark span { color: var(--accent); }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="40"
      data-width="1920"
      data-height="1080"
    >
      <!-- ══════════ 文案区 1/3 · 标题页：换课题改这里 ══════════ -->
      <section id="s1" class="scene clip" data-start="0" data-duration="6" data-track-index="0">
        <div class="kicker" id="s1-kicker">魔力喵 AIGC 大师班 · 课程讲解</div>
        <h1 id="s1-title">AI 短剧制作五步流程</h1>
        <div class="subtitle" id="s1-sub">从一句创意，到一部能播的短剧</div>
      </section>

      <!-- ══════════ 文案区 2/3 · 分步讲解：换步骤改这里（五张卡，依次点亮） ══════════ -->
      <section id="s2" class="scene clip" data-start="6" data-duration="28" data-track-index="0">
        <div class="steps-head">
          <h2 id="s2-title">五步走完一条流水线</h2>
          <div class="hint">每一步过关，再进下一步</div>
        </div>
        <div class="steps">
          <div class="step" id="step1">
            <div class="num">01</div>
            <div class="name">定题材与人设</div>
            <div class="desc">先定给谁看、主角是谁，故事才有根</div>
          </div>
          <div class="step" id="step2">
            <div class="num">02</div>
            <div class="name">写大纲与分集</div>
            <div class="desc">把创意拆开，每一集留一个钩子</div>
          </div>
          <div class="step" id="step3">
            <div class="num">03</div>
            <div class="name">定妆与场景资产</div>
            <div class="desc">角色场景先定版，全剧不走样</div>
          </div>
          <div class="step" id="step4">
            <div class="num">04</div>
            <div class="name">逐镜生成画面</div>
            <div class="desc">按分镜出图、生视频，逐镜验收</div>
          </div>
          <div class="step" id="step5">
            <div class="num">05</div>
            <div class="name">剪辑配音成片</div>
            <div class="desc">剪辑、配音、字幕，一条龙交付</div>
          </div>
        </div>
        <div class="track"><div class="fill" id="track-fill"></div></div>
      </section>

      <!-- ══════════ 文案区 3/3 · 要点收束：换要点改这里 ══════════ -->
      <section id="s3" class="scene clip" data-start="34" data-duration="6" data-track-index="0">
        <h2 id="s3-title">记住这三条</h2>
        <div class="points">
          <div class="point" id="pt1">先资产，后镜头</div>
          <div class="point" id="pt2">每集留钩子</div>
          <div class="point" id="pt3">逐镜验收再合成</div>
        </div>
        <div class="endmark" id="s3-end">魔力喵 <span>AIGC</span> 大师班</div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // 标题页 0–6s
      tl.fromTo("#s1-kicker", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.3);
      tl.fromTo("#s1-title", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.7);
      tl.fromTo("#s1-sub", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 1.4);
      // 分步讲解 6–34s：五张卡依次点亮（每步约 5.5s）
      tl.fromTo("#s2-title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 6.3);
      const lightAt = [6.8, 12.3, 17.8, 23.3, 28.8];
      lightAt.forEach((t, i) => {
        const id = "#step" + (i + 1);
        tl.to(id, { opacity: 1, duration: 0.5, ease: "power2.out" }, t);
        tl.to(id + " .num", { color: "#ffb03a", duration: 0.4 }, t);
        tl.to(id, { borderTopColor: "#ffb03a", backgroundColor: "#1b222b", duration: 0.4 }, t);
        if (i > 0) {
          const prev = "#step" + i;
          tl.to(prev, { opacity: 0.55, duration: 0.5 }, t);
          tl.to(prev + " .num", { color: "#9fb2c3", duration: 0.4 }, t);
          tl.to(prev, { borderTopColor: "#4cc2ff", duration: 0.4 }, t);
        }
      });
      tl.to("#step5", { opacity: 1, duration: 0.1 }, 33.5);
      tl.fromTo("#track-fill", { scaleX: 0 }, { scaleX: 1, duration: 26.6, ease: "none" }, 6.9);
      // 收束页 34–40s
      tl.fromTo("#s3-title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 34.3);
      tl.fromTo("#pt1", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 34.9);
      tl.fromTo("#pt2", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 35.4);
      tl.fromTo("#pt3", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 35.9);
      tl.fromTo("#s3-end", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 36.8);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
