<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Noto Sans CJK SC";
        src: local("Noto Sans CJK SC");
      }
      /* ===== 品牌基线（三套模板共用，改配色改这里） ===== */
      :root {
        --ground: #101418;
        --panel: #1b222b;
        --ink: #f2f5f8;
        --sub: #9fb2c3;
        --accent: #ffb03a;
        --accent2: #4cc2ff;
        --font-display: "Noto Sans CJK SC", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px;
        overflow: hidden; background: var(--ground);
        font-family: var(--font-display);
      }
      #root { position: relative; width: 100%; height: 100%; }
      .scene {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
      }
      /* ===== 版本标题页 ===== */
      .badge {
        color: var(--ground); background: var(--accent); border-radius: 999px;
        font-size: 32px; font-weight: 700; letter-spacing: 0.18em;
        padding: 14px 38px; margin-bottom: 48px;
      }
      h1 { color: var(--ink); font-size: 116px; font-weight: 700; letter-spacing: 0.02em; }
      .feature-line { color: var(--accent2); font-size: 64px; font-weight: 700; margin-top: 44px; }
      .line { width: 460px; height: 8px; background: var(--accent); border-radius: 4px; margin-top: 36px; transform: scaleX(0); }
      /* ===== 功能卡页 ===== */
      h2 { color: var(--ink); font-size: 72px; font-weight: 700; margin-bottom: 60px; }
      .cards { display: flex; gap: 40px; }
      .card {
        width: 500px; height: 480px; background: var(--panel);
        border-radius: 24px; border-top: 8px solid var(--accent2);
        padding: 44px 40px; position: relative;
      }
      .card .tag {
        position: absolute; top: 36px; right: 36px;
        color: var(--accent); border: 3px solid var(--accent); border-radius: 10px;
        font-size: 28px; font-weight: 700; letter-spacing: 0.15em; padding: 6px 16px;
      }
      .card .icon { font-size: 84px; font-weight: 700; color: var(--accent2); margin-bottom: 30px; }
      .card .name { color: var(--ink); font-size: 50px; font-weight: 700; line-height: 1.3; margin-bottom: 20px; }
      .card .desc { color: var(--sub); font-size: 32px; line-height: 1.55; }
      .track { width: 1600px; height: 10px; background: #232c36; border-radius: 5px; margin-top: 56px; overflow: hidden; }
      .track .fill { width: 100%; height: 100%; background: var(--accent2); transform-origin: left center; transform: scaleX(0); }
      /* ===== 收束页 ===== */
      .slogan { color: var(--ink); font-size: 84px; font-weight: 700; text-align: center; line-height: 1.4; }
      .slogan span { color: var(--accent); }
      .endmark { color: var(--sub); font-size: 42px; margin-top: 76px; letter-spacing: 0.25em; }
      .endmark span { color: var(--accent); }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <!-- ══════════ 文案区 1/3 · 版本标题：换版本改这里 ══════════ -->
      <section id="s1" class="scene clip" data-start="0" data-duration="7" data-track-index="0">
        <div class="badge" id="s1-badge">新版本 · V1.2</div>
        <h1 id="s1-title">魔力喵 Studio 更新</h1>
        <div class="feature-line" id="s1-line">批量生图队列上线</div>
        <div class="line" id="s1-underline"></div>
      </section>

      <!-- ══════════ 文案区 2/3 · 新功能三卡：换功能改这里 ══════════ -->
      <section id="s2" class="scene clip" data-start="7" data-duration="16" data-track-index="0">
        <h2 id="s2-title">这次更新了什么</h2>
        <div class="cards">
          <div class="card" id="card1">
            <div class="tag">NEW</div>
            <div class="icon">队</div>
            <div class="name">排队生成</div>
            <div class="desc">任务排成队往下跑<br />一张显卡只干一件重活</div>
          </div>
          <div class="card" id="card2">
            <div class="tag">NEW</div>
            <div class="icon">续</div>
            <div class="name">暂停能续跑</div>
            <div class="desc">批量任务一键暂停<br />回来接着跑，不重头来</div>
          </div>
          <div class="card" id="card3">
            <div class="tag">NEW</div>
            <div class="icon">铃</div>
            <div class="name">完成自动通知</div>
            <div class="desc">图出好了立刻提醒<br />不用守着屏幕干等</div>
          </div>
        </div>
        <div class="track"><div class="fill" id="track-fill"></div></div>
      </section>

      <!-- ══════════ 文案区 3/3 · 收束 slogan：换口号改这里 ══════════ -->
      <section id="s3" class="scene clip" data-start="23" data-duration="7" data-track-index="0">
        <div class="slogan" id="s3-slogan">把时间留给创作<br />把等待交给<span>队列</span></div>
        <div class="endmark" id="s3-end">魔力喵 <span>AIGC</span> 工作室</div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // 版本标题 0–7s
      tl.fromTo("#s1-badge", { opacity: 0, y: -28 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
      tl.fromTo("#s1-title", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.7);
      tl.fromTo("#s1-line", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 1.5);
      tl.fromTo("#s1-underline", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.out" }, 2.2);
      // 功能卡 7–23s
      tl.fromTo("#s2-title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 7.3);
      tl.fromTo("#card1", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 7.9);
      tl.fromTo("#card2", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 8.5);
      tl.fromTo("#card3", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 9.1);
      tl.fromTo("#track-fill", { scaleX: 0 }, { scaleX: 1, duration: 15.2, ease: "none" }, 7.4);
      // 收束 23–30s
      tl.fromTo("#s3-slogan", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 23.4);
      tl.fromTo("#s3-end", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 24.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
